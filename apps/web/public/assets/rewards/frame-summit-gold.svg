<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Golden Peak Ring -->
  <circle cx="100" cy="100" r="82" stroke="url(#goldGrad)" stroke-width="16" fill="none" filter="url(#goldGlow)"/>
  <circle cx="100" cy="100" r="91" stroke="#FDE047" stroke-width="3" fill="none"/>
  <!-- Mountain Summit Badge Peak -->
  <g transform="translate(100, 14)" filter="url(#goldGlow)">
    <polygon points="0,-12 10,8 -10,8" fill="#FBBF24" stroke="#78350F" stroke-width="2"/>
    <polygon points="0,-12 4,-2 -4,-2" fill="#FFFFFF"/>
  </g>
  <g transform="translate(40, 40)" filter="url(#goldGlow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#FBBF24"/>
  </g>
  <g transform="translate(160, 40)" filter="url(#goldGlow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#FBBF24"/>
  </g>
  <circle cx="100" cy="180" r="6" fill="#FBBF24"/>
</svg>
