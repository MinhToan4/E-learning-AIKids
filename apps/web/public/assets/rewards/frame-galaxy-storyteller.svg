<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="magicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Storyteller Magic Circle -->
  <circle cx="100" cy="100" r="82" stroke="url(#storyGrad)" stroke-width="16" fill="none" filter="url(#magicGlow)"/>
  <circle cx="100" cy="100" r="91" stroke="#F472B6" stroke-dasharray="4 6" stroke-width="3" fill="none"/>
  <!-- Magic Wand & Stars -->
  <g transform="translate(100, 14)" filter="url(#magicGlow)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#FDE047"/>
  </g>
  <g transform="translate(176, 100)" filter="url(#magicGlow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#C084FC"/>
  </g>
  <g transform="translate(24, 100)" filter="url(#magicGlow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#F472B6"/>
  </g>
  <circle cx="100" cy="180" r="5" fill="#FDE047"/>
</svg>
