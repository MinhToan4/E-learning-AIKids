<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="35%" stop-color="#6D28D9"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="galaxyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Cosmic Orbit Outer Ring -->
  <circle cx="100" cy="100" r="84" stroke="url(#galaxyGrad)" stroke-width="16" fill="none" filter="url(#galaxyGlow)"/>
  <circle cx="100" cy="100" r="93" stroke="#FDE047" stroke-dasharray="6 8" stroke-width="2.5" fill="none"/>
  <circle cx="100" cy="100" r="74" stroke="#A855F7" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Orbiting Planets and Stars -->
  <g transform="translate(100, 12)" filter="url(#galaxyGlow)">
    <circle cx="0" cy="0" r="8" fill="#FBBF24"/>
    <path d="M-12,0 C-12,-4 12,-4 12,0 C12,4 -12,4 -12,0 Z" stroke="#FEF08A" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(178, 110)" filter="url(#galaxyGlow)">
    <polygon points="0,-9 3,-3 9,-3 4,2 6,8 0,4 -6,8 -4,2 -9,-3 -3,-3" fill="#E0E7FF"/>
  </g>
  <g transform="translate(22, 90)" filter="url(#galaxyGlow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#F472B6"/>
  </g>
  <g transform="translate(130, 178)" filter="url(#galaxyGlow)">
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" fill="#FBBF24"/>
  </g>
  <circle cx="55" cy="28" r="2.5" fill="#FFFFFF"/>
  <circle cx="165" cy="50" r="3" fill="#FDE047"/>
  <circle cx="35" cy="155" r="2" fill="#C084FC"/>
</svg>
