<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="workshopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="gearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Theme Badge Box -->
  <rect x="15" y="15" width="170" height="170" rx="35" fill="url(#workshopBg)" filter="url(#gearGlow)"/>
  <rect x="22" y="22" width="156" height="156" rx="28" stroke="#FED7AA" stroke-width="2.5" fill="none" opacity="0.8"/>
  <!-- Interactive Gear Icon -->
  <g transform="translate(100, 90)" filter="url(#gearGlow)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
    <!-- Gear teeth -->
    <rect x="-6" y="-42" width="12" height="84" rx="4" fill="#FFFFFF"/>
    <rect x="-6" y="-42" width="12" height="84" rx="4" fill="#FFFFFF" transform="rotate(45)"/>
    <rect x="-6" y="-42" width="12" height="84" rx="4" fill="#FFFFFF" transform="rotate(90)"/>
    <rect x="-6" y="-42" width="12" height="84" rx="4" fill="#FFFFFF" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="18" fill="#EA580C"/>
    <circle cx="0" cy="0" r="8" fill="#FBBF24"/>
  </g>
  <!-- Lightbulb -->
  <g transform="translate(150, 45)" filter="url(#gearGlow)">
    <circle cx="0" cy="0" r="10" fill="#FDE047"/>
    <rect x="-4" y="8" width="8" height="6" fill="#D97706"/>
  </g>
  <!-- Paintbrush -->
  <g transform="translate(45, 145)" filter="url(#gearGlow)">
    <path d="M-5,-15 L5,-15 L3,5 L-3,5 Z" fill="#38BDF8"/>
    <rect x="-2" y="5" width="4" height="20" rx="2" fill="#78350F"/>
  </g>
</svg>
