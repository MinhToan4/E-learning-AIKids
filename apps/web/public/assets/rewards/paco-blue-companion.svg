<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="pacoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pacoFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="pacoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Robot Antenna -->
  <line x1="85" y1="35" x2="80" y2="15" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="35" x2="120" y2="15" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="15" r="7" fill="#FBBF24" filter="url(#pacoGlow)"/>
  <circle cx="120" cy="15" r="7" fill="#FBBF24" filter="url(#pacoGlow)"/>

  <!-- Robot Head & Body (Rounded Clay Robot) -->
  <rect x="35" y="30" width="130" height="120" rx="35" fill="url(#pacoBody)" filter="url(#pacoGlow)"/>
  <rect x="42" y="37" width="116" height="106" rx="28" stroke="#7DD3FC" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Screen Face -->
  <rect x="50" y="48" width="100" height="70" rx="18" fill="url(#pacoFace)"/>
  <rect x="53" y="51" width="94" height="64" rx="15" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Glowing Digital Eyes -->
  <circle cx="80" cy="80" r="10" fill="#38BDF8" filter="url(#pacoGlow)"/>
  <circle cx="80" cy="80" r="4" fill="#FFFFFF"/>
  <circle cx="120" cy="80" r="10" fill="#38BDF8" filter="url(#pacoGlow)"/>
  <circle cx="120" cy="80" r="4" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 88,98 Q 100,108 112,98" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Cute Blush Spot -->
  <ellipse cx="68" cy="94" rx="6" ry="3.5" fill="#F472B6" opacity="0.7"/>
  <ellipse cx="132" cy="94" rx="6" ry="3.5" fill="#F472B6" opacity="0.7"/>

  <!-- Paco Badge -->
  <rect x="70" y="128" width="60" height="18" rx="9" fill="#FFFFFF"/>
  <text x="100" y="141" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#0284C7" text-anchor="middle">PACO</text>

  <!-- Waving Hand -->
  <path d="M 165,85 Q 185,75 180,60 Q 170,55 160,70" fill="url(#pacoBody)" stroke="#0284C7" stroke-width="2"/>
</svg>
