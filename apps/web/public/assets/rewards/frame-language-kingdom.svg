<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Royal Emerald Frame -->
  <circle cx="100" cy="100" r="82" stroke="url(#bookGrad)" stroke-width="16" fill="none" filter="url(#royalGlow)"/>
  <circle cx="100" cy="100" r="91" stroke="#FDE047" stroke-width="2.5" fill="none"/>
  <!-- Ornate Golden Book Corner Emblems -->
  <g transform="translate(100, 16)" filter="url(#royalGlow)">
    <path d="M-12,0 Q0,-12 12,0 Q0,4 -12,0 Z" fill="#FBBF24"/>
    <circle cx="0" cy="-2" r="3" fill="#FFFFFF"/>
  </g>
  <g transform="translate(100, 184)" filter="url(#royalGlow)">
    <path d="M-12,0 Q0,12 12,0 Q0,-4 -12,0 Z" fill="#FBBF24"/>
    <circle cx="0" cy="2" r="3" fill="#FFFFFF"/>
  </g>
  <g transform="translate(16, 100)" filter="url(#royalGlow)">
    <path d="M0,-12 Q-12,0 0,12 Q4,0 0,-12 Z" fill="#FBBF24"/>
  </g>
  <g transform="translate(184, 100)" filter="url(#royalGlow)">
    <path d="M0,-12 Q12,0 0,12 Q-4,0 0,-12 Z" fill="#FBBF24"/>
  </g>
  <circle cx="45" cy="45" r="3" fill="#FDE047"/>
  <circle cx="155" cy="45" r="3" fill="#FDE047"/>
  <circle cx="45" cy="155" r="3" fill="#FDE047"/>
  <circle cx="155" cy="155" r="3" fill="#FDE047"/>
</svg>
