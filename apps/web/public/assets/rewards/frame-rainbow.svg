<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="20%" stop-color="#FFA07A"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#4EAE7C"/>
      <stop offset="80%" stop-color="#4DA6FF"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rainbow Circular Frame Ring -->
  <circle cx="100" cy="100" r="82" stroke="url(#rainbowGrad)" stroke-width="18" fill="none" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="91" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="100" cy="100" r="73" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8"/>
  <!-- Decorative Clay Stars -->
  <g transform="translate(100, 14)" filter="url(#glow)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#FFD700"/>
  </g>
  <g transform="translate(176, 75)" filter="url(#glow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#FF6B6B"/>
  </g>
  <g transform="translate(24, 125)" filter="url(#glow)">
    <polygon points="0,-8 2,-2 8,-2 3,2 5,7 0,4 -5,7 -3,2 -8,-2 -2,-2" fill="#4DA6FF"/>
  </g>
  <g transform="translate(140, 170)" filter="url(#glow)">
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" fill="#9B51E0"/>
  </g>
  <!-- Little Sparkle Dots -->
  <circle cx="50" cy="30" r="3" fill="#FFD700"/>
  <circle cx="160" cy="130" r="3.5" fill="#4EAE7C"/>
  <circle cx="35" cy="80" r="2.5" fill="#FF9A9E"/>
</svg>
