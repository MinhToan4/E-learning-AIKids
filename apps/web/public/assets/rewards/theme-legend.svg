<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="legendBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="legendGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="15" y="15" width="170" height="170" rx="35" fill="url(#legendBg)" filter="url(#legendGlow)"/>
  <rect x="22" y="22" width="156" height="156" rx="28" stroke="#FDE047" stroke-width="2.5" fill="none" opacity="0.9"/>
  <!-- Storybook Legend Crown & Book Shield -->
  <path d="M 60,140 L 60,80 L 80,100 L 100,60 L 120,100 L 140,80 L 140,140 Z" fill="#FBBF24" stroke="#FEF08A" stroke-width="3" filter="url(#legendGlow)"/>
  <circle cx="60" cy="75" r="5" fill="#EF4444"/>
  <circle cx="100" cy="55" r="6" fill="#3B82F6"/>
  <circle cx="140" cy="75" r="5" fill="#10B981"/>
  <rect x="75" y="120" width="50" height="12" rx="6" fill="#FFFFFF"/>
</svg>
