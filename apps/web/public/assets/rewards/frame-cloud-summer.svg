<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Sky Blue Circular Frame -->
  <circle cx="100" cy="100" r="82" stroke="url(#cloudGrad)" stroke-width="16" fill="none" filter="url(#cloudGlow)"/>
  <circle cx="100" cy="100" r="91" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <!-- Puffy Soft Clay Clouds -->
  <path d="M 60,175 Q 70,155 85,160 Q 100,145 120,155 Q 135,145 150,160 Q 160,175 140,180 Q 70,185 60,175 Z" fill="#FFFFFF" filter="url(#cloudGlow)"/>
  <path d="M 30,60 Q 40,40 55,45 Q 70,35 85,45 Q 95,60 80,65 Q 40,70 30,60 Z" fill="#FFFFFF" opacity="0.95" filter="url(#cloudGlow)"/>
  <!-- Sun and Sunshine Sparks -->
  <g transform="translate(165, 35)" filter="url(#cloudGlow)">
    <circle cx="0" cy="0" r="14" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="10" fill="#FDE047"/>
  </g>
  <circle cx="130" cy="25" r="3" fill="#FBBF24"/>
  <circle cx="180" cy="70" r="3.5" fill="#38BDF8"/>
  <circle cx="20" cy="110" r="4" fill="#FDE047"/>
</svg>
