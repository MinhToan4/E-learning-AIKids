        <path d="M380,210 Q400,224 417,210 Q434,224 454,210" stroke="#f48108" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>
      <g id="mouth-open" display="none">
        <path d="M380,210 Q417,260 454,210 Z" fill="#e11d48"/>
        <path d="M395,225 Q417,252 439,225 Z" fill="#fb7185"/>
      </g>
      <g id="mouth-eating" display="none">
