  <!-- Rig Bones & Pivot Guides (Hidden by default for animation runtimes) -->
  <g id="rig-guides" display="none">
    <circle id="pivot-root" cx="417" cy="650" r="8" fill="#FF2D75"/>
    <circle id="pivot-head" cx="417" cy="355" r="8" fill="#FF2D75"/>
    <circle id="pivot-left-ear" cx="172" cy="152" r="8" fill="#00E5FF"/>
    <circle id="pivot-right-ear" cx="660" cy="152" r="8" fill="#00E5FF"/>
    <circle id="pivot-left-paw" cx="180" cy="560" r="8" fill="#76FF03"/>
    <circle id="pivot-right-paw" cx="650" cy="560" r="8" fill="#76FF03"/>
    <line x1="417" y1="650" x2="417" y2="355" stroke="#FF2D75" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="417" y1="355" x2="172" y2="152" stroke="#00E5FF" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="417" y1="355" x2="660" y2="152" stroke="#00E5FF" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="417" y1="650" x2="180" y2="560" stroke="#76FF03" stroke-width="4" stroke-dasharray="6 4"/>
