    <linearGradient id="body-grad" x1="417.09" y1="27.39" x2="417.09" y2="711.34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffffe"/>
      <stop offset="0.55" stop-color="#fffffe"/>
      <stop offset="0.87" stop-color="#f6fcfd"/>
      <stop offset="0.93" stop-color="#eaf8fc"/>
      <stop offset="1" stop-color="#cfeef9"/>
