      <ellipse id="right-cheek" cx="574" cy="180" rx="26" ry="16" fill="#fca5a5" opacity="0.6"/>
    </g>

    <!-- Eyebrows / Eye Arches -->
    <g id="eyebrows">
      <path id="left-eyebrow" fill="#f48108" d="M321.56,138.54h0a5.18,5.18,0,0,1-5.11-4.29,24.77,24.77,0,0,0-48.79,0,5.2,5.2,0,0,1-5.11,4.29h0a5.18,5.18,0,0,1-5.14-6,35.16,35.16,0,0,1,69.28,0A5.17,5.17,0,0,1,321.56,138.54Z"/>
      <path id="right-eyebrow" fill="#f48108" d="M571,138.54h0a5.19,5.19,0,0,1-5.11-4.29,24.77,24.77,0,0,0-48.79,0,5.18,5.18,0,0,1-5.11,4.29h0a5.17,5.17,0,0,1-5.13-6,35.16,35.16,0,0,1,69.28,0A5.18,5.18,0,0,1,571,138.54Z"/>
