  <!-- Front Card/Board Desk -->
  <g id="card-holder">
    <rect x="240" y="280" width="354" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.06))"/>
    <rect x="254.59" y="341.48" width="325" height="6" fill="#cbd5e1" rx="3"/>
