    <path id="left-ear-inner" fill="url(#ear-inner-left)" d="M230.18,108.57l-59.46,44.1-59.45,44.09-9.78-75.32-5.85-45a16.89,16.89,0,0,1,23.89-17.72l41.41,18.68Z"/>
  </g>

  <!-- Right Ear Group -->
  <g id="right-ear" transform="rotate(0 660 152)">
    <path id="right-ear-outer" fill="url(#ear-grad-right)" d="M566.73,80.64l94.07,70.73,94.07,70.73,16.34-119.65L781,30.88A26.86,26.86,0,0,0,743.18,2.46l-66,29.26Z"/>
