      <g id="right-eye" transform="translate(0, 0)">
        <ellipse cx="544" cy="138" rx="14" ry="14" fill="#334155"/>
        <circle cx="548" cy="134" r="5" fill="#ffffff"/>
      </g>
    </g>

    <!-- Nose & Bridge -->
    <g id="nose">
      <path fill="#f48108" d="M434.47,150.91H399.72A7.47,7.47,0,0,0,394,163.17l6.45,7.75L411.35,184a7.58,7.58,0,0,0,.85.85v24.69h9.48V185.14a8.06,8.06,0,0,0,1.16-1.11l10.92-13.11,6.45-7.75A7.47,7.47,0,0,0,434.47,150.91Z"/>
    </g>

    <!-- Mouth Switch States (Closed, Open/Happy, Eating snack) -->
    <g id="mouth">
      <g id="mouth-closed">
